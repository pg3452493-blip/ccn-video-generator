name: Generate Reel on Cloud

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup node make_video.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies (Chrome & FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libdbus-1-3 libgconf-2-4 libgdk-pixbuf2.0-0 libnspr4 libpango-1.0-0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2

      - name: Install Node Modules
        run: npm install

      - name: Run Video Generator Script
        run: node make_video.js

      - name: Save Generated Video
        uses: actions/upload-artifact@v4
        with:
          name: ccn-reel
          path: '*.mp4'
