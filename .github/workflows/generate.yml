name: Generate Reel on Cloud

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg & Browser
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx puppeteer browsers install chrome

      - name: Install Node Modules
        run: npm install

      - name: Run Video Generator Script
        run: node make_video.js

      - name: Save Generated Video
        uses: actions/upload-artifact@v4
        with:
          name: ccn-reel
          path: '*.mp4'
