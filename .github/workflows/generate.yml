name: Generate Reel on Cloud

on:
  workflow_dispatch:
    inputs:
      PLAYER_NAME:
        description: 'Player Name'
        required: false
        default: 'SHAI HOPE'
      TEAM_1:
        description: 'Team 1'
        required: false
        default: 'INDIA'
      TEAM_2:
        description: 'Team 2'
        required: false
        default: 'AUSTRALIA'
      NEXT_SCORE:
        description: 'Next Score'
        required: false
        default: '15~ RUNS'
      SCORE_1:
        description: 'Score 1'
        required: false
        default: '38'
      SCORE_2:
        description: 'Score 2'
        required: false
        default: '15'
      SCORE_3:
        description: 'Score 3'
        required: false
        default: '04'
      SCORE_4:
        description: 'Score 4'
        required: false
        default: '45'
      IMAGE_URL:
        description: 'Player Image URL'
        required: false
        default: 'https://images.unsplash.com/photo-1593341646782-e0b495cff86d?w=500'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg & Browser
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          npx puppeteer browsers install chrome

      - name: Install Node Modules
        run: npm install

      - name: Run Video Generator Script
        env:
          PLAYER_NAME: ${{ inputs.PLAYER_NAME }}
          TEAM_1: ${{ inputs.TEAM_1 }}
          TEAM_2: ${{ inputs.TEAM_2 }}
          NEXT_SCORE: ${{ inputs.NEXT_SCORE }}
          SCORE_1: ${{ inputs.SCORE_1 }}
          SCORE_2: ${{ inputs.SCORE_2 }}
          SCORE_3: ${{ inputs.SCORE_3 }}
          SCORE_4: ${{ inputs.SCORE_4 }}
          IMAGE_URL: ${{ inputs.IMAGE_URL }}
        run: node make_video.js

      - name: Save Generated Video
        uses: actions/upload-artifact@v4
        with:
          name: ccn-reel
          path: '*.mp4'

      - name: Install googleapis
        run: npm install googleapis

      - name: Upload to YouTube Shorts
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PLAYER_NAME: ${{ inputs.PLAYER_NAME }}
          TEAM_1: ${{ inputs.TEAM_1 }}
          TEAM_2: ${{ inputs.TEAM_2 }}
        run: node upload_youtube.js
